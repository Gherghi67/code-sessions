# ABOUTME: Builds cs-tui for macOS (arm64, amd64) and Linux (amd64) on version tags
# ABOUTME: Creates a GitHub Release with signed, checksummed binaries for each platform

name: Release

on:
  push:
    tags:
      - 'v*'

# Only the release job writes (it creates the GitHub Release); the build job
# checks out and uploads artifacts, which needs no write access to contents.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: darwin-amd64
            runner: macos-15-large
            target: x86_64-apple-darwin
            ext: ""
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, whose action.yml defaults toolchain to stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: contains(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build cs-tui
        run: cargo build --release --manifest-path tui/Cargo.toml --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "tui/target/${{ matrix.target }}/release/cs-tui${{ matrix.ext }}" "cs-tui-${{ matrix.platform }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cs-tui-${{ matrix.platform }}
          path: cs-tui-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true

      # The binary that signs install.sh and each cs-tui binary reads the
      # release signing key, so a swapped binary could leak it. It is pinned by
      # digest, as test.yml pins shellcheck: the tag names a release, only the
      # hash names the bytes. On a version bump, re-derive the digest from a
      # tarball whose signature verifies against the minisign author's key:
      #   minisign -Vm minisign-<v>-linux.tar.gz -P RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3
      #   sha256sum minisign-<v>-linux.tar.gz
      - name: Install minisign
        env:
          MINISIGN_VERSION: '0.12'
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o minisign.tar.gz \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/
          rm -rf minisign.tar.gz minisign-linux

      # The published install.sh carries the sha256s of this tag's payload
      # files, so with no CS_INSTALL_REF it must fetch them from this tag, not
      # main. Done before signing and checksumming, which then cover it.
      - name: Pin the installer's default payload ref to the tag
        run: |
          sed -i "s|^CS_DEFAULT_REF=main\$|CS_DEFAULT_REF=${GITHUB_REF_NAME}|" install.sh
          grep -qx "CS_DEFAULT_REF=${GITHUB_REF_NAME}" install.sh

      - name: Sign release assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          echo "$MINISIGN_KEY" > /tmp/minisign.key

          minisign -Sm install.sh -s /tmp/minisign.key -t "cs ${GITHUB_REF_NAME}" -W
          for bin in cs-tui-*; do
            minisign -Sm "$bin" -s /tmp/minisign.key -t "cs ${GITHUB_REF_NAME}" -W
          done

          rm -f /tmp/minisign.key

      # A signature the installer would reject must never be published: check
      # each one against the key install.sh verifies with, not the secret.
      - name: Verify signatures against the installer's key
        run: |
          pub=$(sed -n 's/^CS_SIGN_PUBKEY="\(.*\)"$/\1/p' install.sh)
          [ -n "$pub" ] && [ "$(printf '%s\n' "$pub" | wc -l)" -eq 1 ] \
            || { echo "install.sh does not hold exactly one CS_SIGN_PUBKEY"; exit 1; }
          minisign -Vm install.sh -P "$pub"
          for bin in cs-tui-*; do
            [[ "$bin" == *.minisig ]] && continue
            minisign -Vm "$bin" -P "$pub"
          done

      - name: Generate checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          for bin in cs-tui-*; do
            [[ "$bin" == *.minisig ]] && continue
            sha256sum "$bin" > "${bin}.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            install.sh
            install.sh.minisig
            install.sh.sha256
            cs-tui-*
          generate_release_notes: true
          # A file pattern that matches nothing fails the release instead of
          # publishing it without that asset.
          fail_on_unmatched_files: true
          # Created as a draft, so no one sees a release whose uploads have not
          # all landed; the next step publishes it.
          draft: true
          # A hyphenated tag (v1.2.3-rc1, v0.0.0-smoke) is a pre-release: it must
          # never become the repo's Latest, which is what installers resolve.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
