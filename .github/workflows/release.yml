# ABOUTME: Builds cs-tui for macOS (arm64, amd64) and Linux (amd64) on version tags
# ABOUTME: Publishes release binaries and their manifest for local SSH signing

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: darwin-amd64
            runner: macos-15-large
            target: x86_64-apple-darwin
            ext: ""
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: contains(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build cs-tui
        run: cargo build --release --manifest-path tui/Cargo.toml --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "tui/target/${{ matrix.target }}/release/cs-tui${{ matrix.ext }}" "cs-tui-${{ matrix.platform }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v6
        with:
          name: cs-tui-${{ matrix.platform }}
          path: cs-tui-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      # The published install.sh carries the sha256s of this tag's payload
      # files, so with no CS_INSTALL_REF it must fetch them from this tag, not
      # main. Done before signing and checksumming, which then cover it.
      - name: Pin the installer's default payload ref to the tag
        run: |
          sed -i "s|^CS_DEFAULT_REF=main\$|CS_DEFAULT_REF=${GITHUB_REF_NAME}|" install.sh
          grep -qx "CS_DEFAULT_REF=${GITHUB_REF_NAME}" install.sh

      - name: Generate manifest
        run: |
          export LC_ALL=C
          sha256sum install.sh cs-tui-* > SHA256SUMS

      - name: Generate checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          for bin in cs-tui-*; do
            sha256sum "$bin" > "${bin}.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.sh
            install.sh.sha256
            cs-tui-*
            SHA256SUMS
          generate_release_notes: true
          # A hyphenated tag (v1.2.3-rc1, v0.0.0-smoke) is a pre-release: it must
          # never become the repo's Latest, which is what installers resolve.
          prerelease: ${{ contains(github.ref_name, '-') }}
