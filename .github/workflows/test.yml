# ABOUTME: Runs the bash test suites (macOS + Linux) and the Rust TUI tests on push/PR
# ABOUTME: The release workflow builds binaries only after a green run of this workflow on the tagged commit

name: Test

# Plans, specs and upstream notes under docs/ are the only files no suite reads
# (README, CHANGELOG and the other docs are checked by test_docs and friends),
# so a push that touches nothing else runs no tests.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/superpowers/**'
      - 'docs/upstream/**'
  pull_request:
    paths-ignore:
      - 'docs/superpowers/**'
      - 'docs/upstream/**'

# A newer push to a pull request's branch cancels its older run. Runs on main
# are never cancelled: a release is tagged only on a commit whose own run is
# green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs the tree under test, a pull request's included, so its token
# can only read, whatever the repository's default is, and no checkout leaves
# the token in git's configuration.
permissions:
  contents: read

jobs:
  # Two jobs per OS, each running half the suites (run_all.sh balances the
  # halves by line count). One macOS job ran all of them for 25 minutes.
  bash:
    name: bash (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      # tests/test_suite_guards.sh checks every release tag against its
      # CHANGELOG.md heading, so the checkout fetches the whole history and
      # with it every tag: at the default depth of 1, fetch-tags brings only
      # the tags on the checked-out commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bare runners have no global git identity; cs creates commits when it
      # initializes a session, so the session-lifecycle suites need one.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@claude-sessions.test"
          git config --global user.name "cs CI"

      # age backs cs-secrets sync and jq is a cs requirement. Both are named
      # in CS_TEST_REQUIRE_TOOLS below, so a test that needs one fails on a
      # runner without it instead of skipping and judging nothing.
      - name: Install jq and age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq age

      - name: Install jq and age (macOS)
        if: runner.os == 'macOS'
        run: brew install jq age

      # The mod suites (test_mod_rotate, test_mod_update, test_mods_layout) run
      # their unit tests under bun, which CS_TEST_REQUIRE_TOOLS below declares,
      # so a runner without it fails them rather than skipping them. The
      # action is pinned by commit and bun by version; unlike shellcheck, no
      # digest checks the bun binary, as setup-bun takes none. The mermaid mod's
      # tests run under claude plugin test and still skip here.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Show bun version
        run: bun --version

      # CS_TEST_REQUIRE_TOOLS lists what the steps above install (the age
      # package ships age-keygen). tests/test_lib.sh's require_tool fails a
      # test whose listed tool is missing; any other missing tool skips, and
      # run_all.sh names every skip at the end of the log.
      # The 233-case installer suite reached case 225 without an assertion
      # failure before macOS's 1800 s watchdog stopped it. Its standalone
      # run passes all cases; allow 2400 s under the parallel CI workload.
      # Linux retains its existing 1800 s watchdog.
      - name: Run bash test suites
        env:
          CS_TEST_SHARD: ${{ matrix.shard }}/2
          CS_TEST_REQUIRE_TOOLS: age age-keygen jq bun
          CS_TEST_SUITE_TIMEOUT: ${{ runner.os == 'macOS' && '2400' || '1800' }}
        run: bash tests/run_all.sh

  codex-native:
    name: codex-native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CODEX_NATIVE_VERSION: 0.167.0-alpha.3.2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the pinned native Codex
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-native" --ignore-scripts --no-audit --no-fund \
            "@openai/codex@$CODEX_NATIVE_VERSION"
          test "$("$RUNNER_TEMP/codex-native/node_modules/.bin/codex" --version)" = "codex-cli $CODEX_NATIVE_VERSION"
      # Every native case uses a temporary CODEX_HOME without credentials.
      # The revert test captures synthetic model input at a loopback server;
      # it never calls a hosted model. A missing binary fails, not skips.
      - name: Verify native persistence, display, revert and large messages
        env:
          CS_CODEX_REAL_BIN: ${{ runner.temp }}/codex-native/node_modules/.bin/codex
        run: python3 tests/test_codex_thread.py

  build-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the built files are in sync with lib/ and install.sh.in
        run: |
          bash build.sh
          git diff --exit-code bin/cs bin/cs-secrets bin/cs-codex-thread \
            bin/cs-statusline bin/cs-subagent-statusline hooks/cs-shared.sh hooks/cs-config.sh hooks/cs-engine-events.sh \
            skills/sweep/scripts/cs-shared.sh install.sh \
            || { echo "::error::bin/cs or its helpers, hooks/cs-shared.sh, hooks/cs-config.sh, or install.sh is out of sync with lib/ or install.sh.in. Run ./build.sh and commit the generated files."; exit 1; }
          git ls-files --error-unmatch hooks/cs-config.sh > /dev/null \
            || { echo "::error::hooks/cs-config.sh is built but not committed. Run ./build.sh and commit it."; exit 1; }

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A linter ships new checks in every release, so an unpinned one reddens
      # main on a commit nobody touched. This job blocks, so the binary is pinned
      # by digest: the tag names a release, only the hash names the bytes.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      # Errors fail outright. Warnings are held to the count in
      # .shellcheck-warnings: a rise fails, and so does a fall until the
      # baseline is lowered with it, so the count only ever shrinks.
      # .shellcheckrc declares the shell for the lib/ fragments and excludes
      # the test harness's deliberate subshells.
      - name: Lint shell scripts
        run: bash tests/lint_shell.sh

      # The lint's own tests skip wherever shellcheck is missing; this job
      # installs the pinned one and declares it, so here they fail instead.
      - name: Test the shell lint
        env:
          CS_TEST_REQUIRE_TOOLS: shellcheck
        run: bash tests/test_lint_shell.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Run TUI tests
        run: cargo test --manifest-path tui/Cargo.toml

      # The release's Linux binary, built the way release.yml builds it: a
      # static musl build that needs no apt package, since cs-tui has no C
      # dependency. A push that breaks it fails here, before any tag.
      - name: Build the Linux release binary (musl)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --manifest-path tui/Cargo.toml --target x86_64-unknown-linux-musl
